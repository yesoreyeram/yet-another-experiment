name: Test Grafana Plugin Integration

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-plugin-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install registry dependencies
        run: npm ci
      
      - name: Build registry components
        run: npm run build
      
      - name: Build shadcn registry
        run: npm run build:registry
      
      - name: Commit and push registry files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/r/
          git diff --staged --quiet || git commit -m "Build shadcn registry files [skip ci]"
          git push || echo "No changes to push or push failed"
        continue-on-error: true
      
      - name: Get current branch and commit SHA
        id: git-info
        run: |
          BRANCH=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
      
      - name: Install plugin dependencies
        working-directory: test-plugin/test-test-datasource
        run: npm ci
      
      - name: Setup test plugin with path aliases
        working-directory: test-plugin/test-test-datasource
        run: |
          # Ensure components.json exists in the plugin
          cat > components.json << 'EOF'
          {
            "$schema": "https://ui.shadcn.com/schema.json",
            "style": "default",
            "rsc": false,
            "tsx": true,
            "tailwind": {
              "config": "",
              "css": "",
              "baseColor": "slate",
              "cssVariables": false
            },
            "aliases": {
              "components": "@/components",
              "utils": "@/lib/utils"
            }
          }
          EOF
      
      - name: Add components via shadcn CLI (using local registry)
        working-directory: test-plugin/test-test-datasource
        run: |
          # Start a local HTTP server to serve registry files
          cd ../../
          npx --yes http-server public -p 3456 &
          SERVER_PID=$!
          sleep 2
          
          cd test-plugin/test-test-datasource
          
          # Add button component from local server
          npx --yes shadcn@latest add http://localhost:3456/r/button.json --overwrite --yes
          
          # Add special-button component from local server
          npx --yes shadcn@latest add http://localhost:3456/r/special-button.json --overwrite --yes
          
          # Stop the server
          kill $SERVER_PID || true
          
          echo "Components added successfully via shadcn CLI"
      
      - name: Update imports for plugin compatibility
        working-directory: test-plugin/test-test-datasource
        run: |
          # Update imports in special-button to use relative path if needed
          if [ -f "src/components/special-button/special-button.tsx" ]; then
            sed -i "s|@/components/button|../button|g" src/components/special-button/special-button.tsx || true
          fi
      
      - name: Build Grafana plugin
        working-directory: test-plugin/test-test-datasource
        run: npm run build
      
      - name: Verify plugin build artifacts
        working-directory: test-plugin/test-test-datasource
        run: |
          ls -la dist/
          if [ ! -f "dist/module.js" ]; then
            echo "Error: module.js not found in dist/"
            exit 1
          fi
          if [ ! -f "dist/plugin.json" ]; then
            echo "Error: plugin.json not found in dist/"
            exit 1
          fi
          echo "Plugin build successful!"
      
      - name: Run TypeScript type check on plugin
        working-directory: test-plugin/test-test-datasource
        run: npm run typecheck
